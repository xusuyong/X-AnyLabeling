[project]
name = "x-anylabeling-web"
version = "0.1.0"
description = "X-AnyLabeling Web Version - AI-powered annotation tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.16.0"]
dev = ["pytest>=7.0", "httpx>=0.25", "ruff>=0.1"]
